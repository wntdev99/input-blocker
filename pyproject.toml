[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "input-blocker"
version = "1.0.0"
description = "Linux X11 입력장치 차단 라이브러리 (sudo 불필요)"
requires-python = ">=3.7"
dependencies = ["python-xlib"]

[project.scripts]
input-blocker = "input_blocker:main"
